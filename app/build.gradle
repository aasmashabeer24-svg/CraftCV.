plugins {
    id 'com.android.application'
}

/*
 * Site origin is configurable for an eventual independent CraftCV deployment.
 * Do not set this to an unverified host: the website/backend are not part of
 * this Android repository. No cross-domain session or database migration happens here.
 */
def craftcvWebOverride = System.getenv('CRAFTCV_WEB_URL') ?: findProperty('craftcvWebUrl')
def craftcvWebUrl = (craftcvWebOverride ?: 'https://craftcv-hees13.v2.appdeploy.ai/').toString().trim()
def craftcvSite
try {
    craftcvSite = new java.net.URI(craftcvWebUrl)
} catch (java.net.URISyntaxException e) {
    throw new GradleException('CRAFTCV_WEB_URL must be a valid HTTPS site origin', e)
}
if (craftcvSite.scheme?.toLowerCase(java.util.Locale.ROOT) != 'https' ||
    !craftcvSite.host || craftcvSite.userInfo != null ||
    (craftcvSite.path && craftcvSite.path != '/') ||
    craftcvSite.query != null || craftcvSite.fragment != null ||
    craftcvSite.port != -1) {
    throw new GradleException('CRAFTCV_WEB_URL must be an HTTPS origin, e.g. https://cv.example.com/ (no path, port, query or fragment)')
}
def craftcvSiteHost = craftcvSite.host.toLowerCase(java.util.Locale.ROOT)

android {
    namespace 'com.craftcv.resumestudio'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        buildConfigField 'String', 'CRAFTCV_WEB_URL', "\"https://${craftcvSiteHost}/\""
        applicationId 'com.craftcv.resumestudio'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def path = System.getenv('CRAFTCV_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('CRAFTCV_STORE_PASSWORD')
                keyAlias System.getenv('CRAFTCV_KEY_ALIAS')
                keyPassword System.getenv('CRAFTCV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('CRAFTCV_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug { applicationIdSuffix '.debug' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// AdMob SDK with UMP consent flow; production ads remain disabled until a Standard ad unit is supplied.
dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
