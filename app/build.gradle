plugins {
    id 'com.android.application'
}

android {
    namespace 'com.craftcv.resumestudio'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId 'com.craftcv.resumestudio'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def path = System.getenv('CRAFTCV_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('CRAFTCV_STORE_PASSWORD')
                keyAlias System.getenv('CRAFTCV_KEY_ALIAS')
                keyPassword System.getenv('CRAFTCV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Live ads are OFF by default; the exact app ID and banner ID must
            // come from the owner's AdMob account during the signed release build.
            def liveAppId = System.getenv('CRAFTCV_ADMOB_APP_ID') ?: ''
            def liveBannerId = System.getenv('CRAFTCV_ADMOB_BANNER_UNIT_ID') ?: ''
            def configured = liveAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') &&
                liveBannerId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') &&
                !liveAppId.startsWith('ca-app-pub-3940256099942544') &&
                !liveBannerId.startsWith('ca-app-pub-3940256099942544')
            manifestPlaceholders = [craftcvAdmobAppId:configured?liveAppId:'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'boolean', 'ADMOB_ENABLED', configured?'true':'false'
            buildConfigField 'String', 'ADMOB_BANNER_UNIT_ID', configured?'"'+liveBannerId+'"':'""'
            if (System.getenv('CRAFTCV_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            // Official Google TEST IDs. These IDs must never serve production ads.
            manifestPlaceholders = [craftcvAdmobAppId:'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'boolean', 'ADMOB_ENABLED', 'true'
            buildConfigField 'String', 'ADMOB_BANNER_UNIT_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// Consent-gated AdMob banners are isolated to the native dashboard; no ads in
// editor, preview, PDF, Word or Cover Letter workflows.
dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
