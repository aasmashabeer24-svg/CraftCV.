name: Android CI & release bundle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'HTTPS CraftCV site origin; leave blank for existing AppDeploy site'
        required: false
        type: string
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CRAFTCV_WEB_URL: ${{ github.event.inputs.web_url || '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install API 36
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          if [ -z "$SDKMGR" ]; then echo "Android SDK manager not found on runner"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK and lint
        run: |
          gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: craftcv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch'
        env:
          KEY_BASE64: ${{ secrets.CRAFTCV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CRAFTCV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CRAFTCV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CRAFTCV_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing; will not produce an unsigned release AAB."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/craftcv-upload.jks"
          echo "CRAFTCV_KEYSTORE_PATH=$RUNNER_TEMP/craftcv-upload.jks" >> "$GITHUB_ENV"
          echo "CRAFTCV_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CRAFTCV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CRAFTCV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        if: github.event_name == 'workflow_dispatch'
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload signed AAB
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: craftcv-signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
